        {
          "@type": "Question",
          "name": "Why does Git say there is a conflict when we edited different lines?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Because the two changed regions were adjacent or overlapping once context is included. When one hunk ends where the next begins, the merge cannot determine the order in which to place them, so it asks. Adding content at the same end of a file is the most common case: both additions are kept with the Both option and the order is your decision."
          }
        },
        {
          "@type": "Question",
          "name": "What do the \u003c\u003c\u003c\u003c\u003c\u003c\u003c, ======= and \u003e\u003e\u003e\u003e\u003e\u003e\u003e markers mean?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "They fence off the two competing versions of a conflicting region: the lines between the first marker and ======= are the current branch's version, and the lines between ======= and the last marker are the incoming version. With the diff3 conflict style a ||||||| section between them shows the original text both sides changed. Resolving means replacing the whole block, markers included, with the text you want."
          }
        },
        {
          "@type": "Question",
          "name": "Should I resolve with ours, theirs, or both?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Look at the base. If both sides changed the same value to different values, one of them is the intended one and you pick it. If both sides added different things at the same place, both are usually wanted and the order is the only question. If both sides tried to do the same job in different ways, revert to the base and reimplement once. Read what each side was trying to achieve rather than which text looks tidier."
          }
        },
        {
          "@type": "Question",
          "name": "Can a merge succeed and still break the code?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. A clean merge only guarantees that no text region was edited differently by both sides. Changes in separate files or separate functions that depend on each other — a rename on one branch and a new use of the old name on the other — merge cleanly and fail at build or run time. Treat the merge result as new code and run the tests on it."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between a merge and a rebase conflict?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Mechanically none: both are three-way merges. A merge does it once with the branch tips and their common ancestor. A rebase does it once per commit, with the base moving each time, which is why the same conflict can reappear on consecutive commits. Git's rerere feature records each resolution and replays it when the identical conflict returns."
          }
        }
      ]
