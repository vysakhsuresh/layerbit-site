        {
          "@type": "Question",
          "name": "What is a good color contrast ratio?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For body text, at least 4.5:1 against its background, which is WCAG 2.2 level AA and the level most accessibility laws require. Large text, meaning 24 pixels regular or about 18.7 pixels bold, needs at least 3:1. For long-form reading, aim for 7:1, the AAA level. Icons, form-field borders and focus indicators need at least 3:1 against adjacent colors."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between WCAG AA and AAA?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "They are two conformance levels. AA requires 4.5:1 for normal text and 3:1 for large text, and is the level referenced by laws and procurement rules in the United States, the European Union and elsewhere. AAA requires 7:1 and 4.5:1. W3C does not recommend requiring AAA across entire sites, because some content cannot meet it, but it is a good target for article text and documentation."
          }
        },
        {
          "@type": "Question",
          "name": "Does color contrast apply to icons and buttons?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, under WCAG 2.1 and 2.2 success criterion 1.4.11, Non-text Contrast. Icons that convey meaning, the visible boundary of a button or input, checkbox and radio states, focus indicators and the lines and bars of a chart need at least 3:1 against the colors next to them. A button's label text is still text, so it needs 4.5:1 against the button's fill."
          }
        },
        {
          "@type": "Question",
          "name": "Is APCA part of WCAG?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not yet. APCA was developed for WCAG 3, which is still a working draft and whose contrast method may change before it is finished. WCAG 2.2, with its contrast ratio, is the current W3C recommendation and the basis of legal requirements. Use the WCAG 2.2 ratio to confirm compliance and APCA as an additional check on readability, particularly for dark themes."
          }
        },
        {
          "@type": "Question",
          "name": "How do I fix a brand color that fails contrast?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Keep the brand color for large areas, illustrations and borders, and introduce a darker shade of the same hue for text and small elements on light backgrounds, or a lighter one on dark backgrounds. Adjusting lightness in OKLCH rather than HSL keeps the hue and saturation looking the same. Name the accessible shade as a separate design token so it is used consistently."
          }
        }
