          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The core JavaScript API required to capture a screen stream (navigator.mediaDevices.getDisplayMedia) is intentionally restricted by Apple and Google on mobile operating systems for security reasons. While a mobile device can view the stream, only a desktop/laptop environment can host it."

          "@type": "Question",
          "name": "What is Firebase used for in this app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Firebase Realtime Database acts purely as the \"Signaling Server.\" In order for a P2P connection to occur, both browsers need to exchange connection data (SDP offers and ICE candidates) so they know how to find each other on the internet. Once the connection is established, Firebase's job is done. Chat, files and drawings never go through it."
          }

        {
          "@type": "Question",
          "name": "What does the room password protect?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "With a password, the connection details your browser and each viewer's browser exchange through the signalling service (the session descriptions and network candidates, which include IP addresses) are encrypted with AES-GCM under a key derived from the password with PBKDF2 (150,000 rounds of SHA-256). Someone who has the link but not the password cannot connect, and the signalling service only ever stores ciphertext for those fields. The password itself is never sent anywhere; send it to your viewers separately from the link."
          }
