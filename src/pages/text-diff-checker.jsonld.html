          "name": "How does word-level highlighting work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The engine first runs a line-level diff to find which lines changed. Where a block of removed lines is immediately followed by a block of added lines, it pairs them up and runs a second diff inside each pair at word or character granularity, highlighting only the parts that actually differ. Lines that were purely added or removed are shown whole."
