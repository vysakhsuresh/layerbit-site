        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Unlike basic diff checkers that only show if an entire line was replaced, Layerbit runs a secondary pass on modified lines. If a line is removed and immediately replaced, the engine diffs the characters within those specific lines to highlight the exact insertion or deletion."

        "@type": "Question",
        "name": "What does the \"Ignore Whitespace\" toggle do?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "When code is reformatted by a linter, the indentation changes can create massive false-positive diffs. Toggling this feature forces the engine to ignore tabs, spaces, and line breaks, isolating only the actual logic changes."
