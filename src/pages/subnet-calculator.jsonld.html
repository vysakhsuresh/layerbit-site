          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Two addresses in every IPv4 subnet of /30 or shorter are reserved: the first (all host bits zero) identifies the network itself, and the last (all host bits one) is the directed broadcast address. Neither can be assigned to an interface, so 256 becomes 254. The exception is a /31, which RFC 3021 defines as a two-address point-to-point link with no broadcast, so both addresses are usable."
          }

          "name": "Does IPv6 have a broadcast address?",
          "acceptedAnswer": {
            "@type": "Answer",

          }

          "name": "What is the difference between a netmask and a wildcard mask?",

            "@type": "Answer",
