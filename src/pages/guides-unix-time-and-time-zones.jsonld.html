        {
          "@type": "Question",
          "name": "Does a Unix timestamp have a time zone?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. It counts seconds since 1970-01-01 00:00:00 UTC and identifies a single instant that is the same everywhere. A time zone only enters the picture when you convert that instant into a wall-clock date and time for display, and that conversion is where the zone must be supplied explicitly."
          }
        },
        {
          "@type": "Question",
          "name": "How do I tell whether a timestamp is in seconds or milliseconds?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Count the digits. Current Unix time is a 10-digit number in seconds and a 13-digit number in milliseconds; microseconds have 16 and nanoseconds 19. A value that converts to the year 56,000 was milliseconds read as seconds; one that converts to January 1970 was seconds read as milliseconds."
          }
        },
        {
          "@type": "Question",
          "name": "Should I store dates in UTC or local time?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Store instants — things that have happened — in UTC, and convert to local time only when displaying. Store future appointments as a wall-clock time together with the IANA zone name, because the zone's offset rules may change before the date arrives. Never store just an offset like +04:00 in place of a zone name."
          }
        },
        {
          "@type": "Question",
          "name": "Why does JavaScript treat \"2026-09-27\" as UTC but \"2026-09-27T12:00\" as local?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A historical quirk of the ECMAScript specification: date-only ISO strings are parsed as UTC midnight, while date-time strings without a zone designator are parsed as local time. The inconsistency causes many off-by-one-day bugs. Avoid it by always including a Z or an explicit offset in any date-time string you exchange, and by treating date-only values as plain dates rather than timestamps."
          }
        },

            "@type": "Answer",
