          "@type": "Question",
          "name": "Why does my XPath return nothing when the element is clearly in the document?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Almost always a default namespace. When the root element declares xmlns=\"…\", every unprefixed element is in that namespace, and in XPath 1.0 an unprefixed name in a query matches only elements with no namespace. Bind a prefix to the namespace URI and use it in the query (//a:entry), or use //*[local-name()='entry'] to ignore namespaces."
          }
        },
        {
          "@type": "Question",
          "name": "What is the difference between //item[1] and (//item)[1]?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A predicate applies to the step immediately before it. //item[1] selects the first item child of every parent, so it can return many nodes. (//item)[1] first gathers every item in the document into one set and then takes the first in document order, returning exactly one node."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use regular expressions in XPath?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Only in XPath 2.0 and later, which added matches(), replace() and tokenize(). Browsers, Python's lxml default engine, Java's built-in XPath and most scraping frameworks implement XPath 1.0, where the closest tools are contains(), starts-with(), substring() and translate(). For real pattern matching, extract the text with XPath and apply a regular expression in your language."
          }
        },
        {
          "@type": "Question",
          "name": "Does XPath work on HTML as well as XML?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Browsers support document.evaluate() on HTML documents, and Selenium, Scrapy and similar tools use XPath on parsed HTML routinely. Element names are matched in the case the parser produced, which is lower-case in browsers, and the class attribute is a space-separated list, so test it with contains() on a padded value rather than equality."
          }
        },
        {
          "@type": "Question",
          "name": "Which XPath version do browsers support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "XPath 1.0, through document.evaluate(). That includes all axes, predicates and the core function library, but not the sequences, regular-expression functions, or for-expressions introduced in XPath 2.0 and 3.1. A query using those fails with a syntax error rather than silently returning nothing."
          }
        }
