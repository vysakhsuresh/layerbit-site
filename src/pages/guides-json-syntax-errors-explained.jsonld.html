          "name": "Why does JSON not allow trailing commas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Because the grammar defines an object as key-value pairs separated by commas, with nothing after the last pair. Allowing an optional trailing comma would create two valid spellings of the same value and complicate every parser. JavaScript object literals do permit it, which is why the habit carries over and why it is the most common JSON error."
          }
        },
        {
          "@type": "Question",
          "name": "Can I put comments in a JSON file?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Not in standard JSON. The format was deliberately specified without comments so that it could not carry parsing directives. Configuration files that need them use JSONC (as in VS Code settings) or JSON5, which accept comments, trailing commas and single quotes, but those must be read with a parser that supports them; JSON.parse and most language libraries will reject them."
          }
        },
        {
          "@type": "Question",
          "name": "What does \"Unexpected token in JSON at position N\" mean?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The parser accepted everything up to character index N and found a character there that the grammar does not permit at that point. The actual mistake is often just before that position, such as a missing comma between two values. Convert the position to a line and column, or format the document first so the error lands on a readable line, then look at the named token and to its left."
          }
