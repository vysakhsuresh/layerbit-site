        {
          "@type": "Question",
          "name": "What is a zero-width space and why is it in my text?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "U+200B is a Unicode format character that occupies no space on screen and marks a point where a line may break inside a word. It enters text through copy and paste, most often from PDFs, web pages and messaging apps that insert it for layout. Because it is a real character in the string, it breaks exact matching, search and parsing while remaining invisible in every editor."
          }
        },
        {
          "@type": "Question",
          "name": "How do I remove invisible characters from a string?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use the Unicode format-character class rather than a hand-made list: in JavaScript s.replace(/\\p{Cf}/gu, ''), in Python filter out characters whose unicodedata.category is 'Cf'. Then replace no-break and typographic spaces with ordinary spaces and normalize to NFC. Be careful with zero-width joiners in scripts and emoji sequences where they carry meaning."
          }
        },
        {
          "@type": "Question",
          "name": "Why does my CSV header say \"﻿id\" instead of \"id\"?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The file starts with a byte order mark, U+FEFF, which Excel's \"CSV UTF-8\" export and many Windows editors prepend. A parser that does not strip it treats the three bytes as part of the first field. Open the file with a BOM-aware encoding (utf-8-sig in Python), or strip a leading U+FEFF before parsing the header row."
          }
        },
        {
          "@type": "Question",
          "name": "What is a Trojan Source attack?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A technique (CVE-2021-42574) that uses Unicode bidirectional override characters inside source code comments or strings so that the code an editor displays differs from the code a compiler reads. A reviewer sees harmless logic while the stored order does something else. Modern editors and code hosts warn on these characters, and inspecting code points reveals them immediately."
          }
        },
        {
          "@type": "Question",
          "name": "Why does \"café\" not equal \"café\" in my code?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "One string uses the precomposed é (U+00E9) and the other uses e followed by a combining acute accent (U+0065 U+0301). They look identical and Unicode defines them as canonically equivalent, but they are different sequences of code points. Normalize both to the same form, NFC for storage, before comparing."
          }
        }
