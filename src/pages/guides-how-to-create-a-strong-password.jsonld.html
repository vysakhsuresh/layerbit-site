        {
          "@type": "Question",
          "name": "How long should a password be in 2026?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For a randomly generated password stored in a password manager, use at least 16 characters; that gives about 100 bits with letters, digits and symbols, far beyond any practical attack. For a password or passphrase you type from memory, use six or seven random words, about 77 to 90 bits. Length matters more than complexity: each extra character multiplies the attacker's work, while adding symbols adds only a fraction of a bit per character."
          }
        },
        {
          "@type": "Question",
          "name": "Is a passphrase better than a password?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Neither is better in principle; strength comes from random selection and length. A six-word Diceware passphrase and a 12-character random password have similar strength. The passphrase is far easier to remember and type, so it is the better choice for the few secrets you enter by hand, such as a password manager's master password. For everything a manager fills in for you, a long random password is simpler."
          }
        },
        {
          "@type": "Question",
          "name": "Do special characters make a password stronger?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Slightly, if the password is random: the full keyboard set adds about 0.6 bits per character compared with letters and digits alone. In a human-chosen password they add almost nothing, because people put them in predictable places, such as an exclamation mark at the end or @ in place of a, and cracking tools try those substitutions first. Adding two or three characters of length helps more than any symbol."
          }
        },
        {
          "@type": "Question",
          "name": "How often should I change my passwords?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Only when there is a reason: the site reports a breach, you suspect phishing, you typed it on a device you do not trust, or your password manager flags it as exposed or reused. NIST's guidance dropped mandatory periodic changes because they push people towards weak passwords that differ by a digit. A strong, unique password protected by two-factor authentication can stay in place."
          }
        },
        {
          "@type": "Question",
          "name": "Is it safe to use an online password generator?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "It is safe when the password is generated in your browser and never transmitted, which you can confirm by checking the browser's Network tab or by using the page offline. Avoid generators that produce the password on a server, and prefer ones that use the browser's cryptographic random generator, crypto.getRandomValues, rather than Math.random. The generator built into your password manager is also a good choice."
          }
