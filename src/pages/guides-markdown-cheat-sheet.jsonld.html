          "name": "How do I add a line break in Markdown?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "End the line with a backslash, or with two trailing spaces, and continue on the next line. A plain newline inside a paragraph is treated as a space, and a blank line starts a new paragraph. The backslash is the more robust choice because it is visible in the source and is not removed by editors that strip trailing whitespace. Some platforms, such as GitHub comments, treat every newline as a break automatically."
          }
        },
        {
          "@type": "Question",
          "name": "How do I create a table in Markdown?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Write a header row with cells separated by pipes, then a divider row of dashes, then one row per line: | Name | Role | on the first line, | --- | --- | on the second, and | Ada | Engineer | below. Add colons to the divider to align columns: :--- left, :---: centre, ---: right. Tables are a GitHub-Flavored Markdown extension, supported by GitHub, GitLab and most modern renderers."
          }
        },

          "@type": "Question",
          "name": "Why is my nested list not indenting?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A child list item must be indented at least as far as the text of its parent item, not just its marker. For a parent written as \"- item\" that means two spaces; for \"1. item\" it means three. Using four spaces for each level works in every renderer. Also make sure there is no blank line between items unless you want a loose list with paragraph spacing."
          }

          "name": "What is the difference between Markdown and GitHub-Flavored Markdown?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GitHub-Flavored Markdown is a superset of CommonMark, the standardised form of Markdown. It adds tables, task lists, strikethrough with double tildes, automatic linking of bare URLs, and rules for filtering unsafe raw HTML. GitHub itself adds further features on top, such as mentions, issue references, footnotes, alerts and Mermaid diagrams, that are not part of the GFM specification."
          }

          "name": "How do I escape a character in Markdown?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Put a backslash in front of it. \\* shows a literal asterisk, \\_ an underscore, \\# a hash at the start of a line, \\| a pipe inside a table cell and \\` a backtick. Any ASCII punctuation character can be escaped this way. Inside inline code or a fenced code block, everything is already literal and needs no escaping."
