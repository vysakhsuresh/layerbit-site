            "@type": "Answer",

          "@type": "Question",
          "name": "What is a zero-width space and how do I remove it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "U+200B is a Unicode format character that takes no space on screen and exists to mark a possible line break inside a word. It enters text through copy and paste from PDFs, web pages and messaging apps. It breaks exact matching, search and parsing because it is a real character in the string. Remove it by replacing the code point: in JavaScript str.replace(/​/g, ''), or more broadly str.replace(/\\p{Cf}/gu, '') to strip every format character. The clean-copy button on this page does the same and also converts no-break spaces to ordinary spaces."
          }

            "@type": "Answer",
