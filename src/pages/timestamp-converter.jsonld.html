          "name": "How does the tool know whether my number is seconds or milliseconds?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "By its size. Current Unix time in seconds is a 10-digit number, in milliseconds 13 digits, in microseconds 16 and in nanoseconds 19. The tool picks the unit whose range contains the number and states the assumption next to the result. If a value was genuinely meant as seconds but is 13 digits long, it would represent a date tens of thousands of years away, which is almost never what anyone intended. When the Unix reading lands outside 1990 to 2100 and the number has the shape of another clock (an 18-digit Windows FILETIME or .NET tick count, or an Excel serial with a fraction), that reading is used and the hint says so. Other plausible readings, such as Apple Cocoa seconds, are offered as one-click buttons, and \"The number is\" sets the format explicitly."

            "text": "Paste the number and pick its format under \"The number is\", or leave it on detect. .NET DateTime.Ticks counts 100-nanosecond intervals since 1 January 0001. A Windows FILETIME counts 100-nanosecond intervals since 1 January 1601, and Active Directory attributes such as lastLogonTimestamp and pwdLastSet, often called LDAP timestamps, use the same count; 0 and 9223372036854775807 mean \"never\". FILETIME is also accepted as two hexadecimal DWORDs, 0x01C98E33:0x3296F500. The conversion uses exact integer arithmetic, so no 100-nanosecond tick is lost."
