name: Build check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify committed pages match src/partials + src/pages
        run: python3 build.py --check

      - name: Validate HTML structure, JSON-LD, inline JS and link graph
        run: python3 scripts/validate.py

  tool-tests:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Drive every tool in headless Chromium (minimal -> maximal inputs)
        run: python3 scripts/test_tools.py
