name: Build check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Unit-test the tool engines
        run: for f in scripts/unit/*.test.js; do node "$f" || exit 1; done

      - name: Verify committed pages match src/partials + src/pages
        run: python3 build.py --check

      - name: Validate HTML structure, JSON-LD, inline JS and link graph
        run: python3 scripts/validate.py

      - name: Parity claims are backed by tests (unit tests run; browser tests must exist)
        run: python3 scripts/check_parity.py --self-test && python3 scripts/check_parity.py

  tool-tests:
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Drive every tool in headless Chromium (minimal -> maximal inputs)
        run: python3 scripts/test_tools.py --json ui-results.json

      - name: Every parity claim's browser tests passed
        run: python3 scripts/check_parity.py --ui-results ui-results.json
